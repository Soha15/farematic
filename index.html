<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Farematic — Know your fare before you flag one down</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EDEAE1;
    --paper-dim:#E3DFD3;
    --ink:#1C1B19;
    --ink-soft:#5A564C;
    --auto-yellow:#F2B705;
    --auto-yellow-deep:#C9950A;
    --route-red:#A63A2E;
    --line:#C9C2AF;
    --success:#3B6E4E;
    --radius:2px;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  body{
    min-height:100vh;
    background-image:
      radial-gradient(circle at 1px 1px, rgba(28,27,25,0.06) 1px, transparent 0);
    background-size: 22px 22px;
  }

  .wrap{
    max-width:720px;
    margin:0 auto;
    padding:48px 20px 80px;
  }

  /* ---------- Header: permit plate ---------- */
  .plate{
    background:var(--ink);
    color:var(--auto-yellow);
    border-radius:6px;
    padding:18px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    box-shadow: 0 3px 0 rgba(0,0,0,0.15);
    position:relative;
  }
  .plate::before{
    content:"";
    position:absolute;
    inset:5px;
    border:1px dashed rgba(242,183,5,0.35);
    border-radius:3px;
    pointer-events:none;
  }
  .plate-title{
    font-family:'Rajdhani', sans-serif;
    font-weight:700;
    font-size:28px;
    letter-spacing:0.08em;
    margin:0;
  }
  .plate-code{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:rgba(242,183,5,0.6);
    letter-spacing:0.05em;
  }

  .tagline{
    font-family:'Rajdhani', sans-serif;
    font-weight:500;
    font-size:15px;
    color:var(--ink-soft);
    text-align:center;
    margin:14px 0 40px;
    letter-spacing:0.03em;
  }

  /* ---------- Ticket booking form ---------- */
  .booking{
    background:var(--paper-dim);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:24px;
    position:relative;
  }

  .booking::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:-1px;
    height:0;
    border-bottom:2px dashed var(--line);
  }

  .field-row{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    gap:14px;
    align-items:end;
  }

  .field label{
    display:block;
    font-family:'Rajdhani', sans-serif;
    font-weight:600;
    font-size:12px;
    letter-spacing:0.14em;
    color:var(--ink-soft);
    margin-bottom:6px;
  }

  .field input{
    width:100%;
    background:var(--paper);
    border:1px solid var(--ink);
    border-radius:1px;
    padding:11px 12px;
    font-family:'IBM Plex Mono', monospace;
    font-size:14px;
    color:var(--ink);
  }
  .field input:focus{
    outline:none;
    box-shadow: 0 0 0 2px var(--auto-yellow);
  }
  .field input::placeholder{ color:#9C9686; }

  .swap-icon{
    font-family:'IBM Plex Mono', monospace;
    color:var(--ink-soft);
    font-size:18px;
    padding-bottom:10px;
    user-select:none;
  }

  .go-btn{
    margin-top:18px;
    width:100%;
    background:var(--auto-yellow);
    border:1px solid var(--ink);
    color:var(--ink);
    font-family:'Rajdhani', sans-serif;
    font-weight:700;
    font-size:16px;
    letter-spacing:0.1em;
    padding:13px;
    border-radius:1px;
    cursor:pointer;
    transition:transform 0.08s ease, background 0.15s ease;
  }
  .go-btn:hover{ background:var(--auto-yellow-deep); }
  .go-btn:active{ transform:translateY(1px); }
  .go-btn:disabled{ opacity:0.55; cursor:progress; }

  .status-line{
    margin-top:14px;
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    color:var(--ink-soft);
    min-height:16px;
    letter-spacing:0.02em;
  }
  .status-line.err{ color:var(--route-red); }

  /* ---------- Results ---------- */
  .trip-meta{
    display:flex;
    gap:24px;
    justify-content:center;
    margin:28px 0 20px;
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    color:var(--ink-soft);
    letter-spacing:0.03em;
  }
  .trip-meta b{ color:var(--ink); font-weight:600; }

  .stubs{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:16px;
  }
  @media (max-width:640px){
    .stubs{ grid-template-columns:1fr; }
    .field-row{ grid-template-columns:1fr; }
    .swap-icon{ display:none; }
  }

  .stub{
    position:relative;
    background:var(--paper);
    border:1px solid var(--ink);
    padding:18px 16px 20px;
    text-align:center;
    opacity:0;
    transform:translateY(8px);
    animation:rise 0.45s ease forwards;
  }
  .stub:nth-child(1){ animation-delay:0.05s; }
  .stub:nth-child(2){ animation-delay:0.15s; }
  .stub:nth-child(3){ animation-delay:0.25s; }

  @keyframes rise{
    to{ opacity:1; transform:translateY(0); }
  }

  /* perforated tear edge along the bottom of each stub */
  .stub::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:-7px;
    height:14px;
    background-image: radial-gradient(circle 6px, var(--paper) 6px, transparent 6.5px);
    background-size: 16px 14px;
    background-position: -4px 0;
    background-repeat: repeat-x;
  }

  .stub.best{
    border-color:var(--route-red);
    background:#F4E9D8;
  }

  .stamp{
    position:absolute;
    top:10px;
    right:10px;
    border:2px solid var(--route-red);
    color:var(--route-red);
    font-family:'Rajdhani', sans-serif;
    font-weight:700;
    font-size:10.5px;
    letter-spacing:0.08em;
    padding:3px 6px;
    border-radius:3px;
    transform:rotate(9deg);
    mix-blend-mode:multiply;
    opacity:0.85;
  }

  .provider{
    font-family:'Rajdhani', sans-serif;
    font-weight:700;
    font-size:17px;
    letter-spacing:0.05em;
    margin-bottom:2px;
  }

  .fare-currency{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    color:var(--ink-soft);
  }
  .fare-amount{
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    font-size:30px;
    letter-spacing:0.01em;
    font-variant-numeric: tabular-nums;
  }

  .eta{
    margin-top:8px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    color:var(--ink-soft);
    border-top:1px dashed var(--line);
    padding-top:8px;
  }

  .footprint{
    text-align:center;
    margin-top:44px;
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    color:#9C9686;
    letter-spacing:0.04em;
  }

  /* reduced motion */
  @media (prefers-reduced-motion: reduce){
    .stub{ animation:none; opacity:1; transform:none; }
  }
</style>
</head>
<body>

<div class="wrap">

  <div class="plate">
    <p class="plate-title">FAREMATIC</p>
    <span class="plate-code">RTE&nbsp;·&nbsp;METER&nbsp;·&nbsp;COMPARE</span>
  </div>
  <p class="tagline">Know your fare before you flag one down.</p>

  <div class="booking">
    <div class="field-row">
      <div class="field">
        <label for="start">From</label>
        <input id="start" type="text" placeholder="e.g. Gachibowli" autocomplete="off">
      </div>
      <div class="swap-icon">&#8594;</div>
      <div class="field">
        <label for="end">To</label>
        <input id="end" type="text" placeholder="e.g. Secunderabad" autocomplete="off">
      </div>
    </div>

    <button class="go-btn" id="goBtn">CHECK FARES</button>
    <div class="status-line" id="statusLine"></div>
  </div>

  <div id="tripMeta" class="trip-meta" style="display:none;"></div>
  <div id="stubs" class="stubs"></div>

  <p class="footprint">FARE ESTIMATES ARE APPROXIMATE &middot; ACTUAL PRICING SET BY EACH PROVIDER</p>
</div>

<script>
  // If the frontend is served by the same FastAPI app, leave this empty.
  // If hosted separately, set it to your deployed API base, e.g.
  // const API_BASE = "https://your-app-name.azurewebsites.net";
  const API_BASE = "";

  const startInput = document.getElementById('start');
  const endInput = document.getElementById('end');
  const goBtn = document.getElementById('goBtn');
  const statusLine = document.getElementById('statusLine');
  const tripMeta = document.getElementById('tripMeta');
  const stubsEl = document.getElementById('stubs');

  const providerOrder = ['Uber', 'Ola', 'Rapido'];

  function animateNumber(el, target, prefix) {
    const duration = 550;
    const start = performance.now();
    function tick(now) {
      const p = Math.min(1, (now - start) / duration);
      const eased = 1 - Math.pow(1 - p, 3);
      const val = Math.round(target * eased);
      el.textContent = prefix + val;
      if (p < 1) requestAnimationFrame(tick);
      else el.textContent = prefix + target;
    }
    requestAnimationFrame(tick);
  }

  async function checkFares() {
    const start = startInput.value.trim();
    const end = endInput.value.trim();

    if (!start || !end) {
      statusLine.textContent = 'Enter both a pickup and a drop location.';
      statusLine.classList.add('err');
      return;
    }

    statusLine.classList.remove('err');
    statusLine.textContent = 'Calculating route…';
    goBtn.disabled = true;
    stubsEl.innerHTML = '';
    tripMeta.style.display = 'none';

    try {
      const res = await fetch(`${API_BASE}/recommend?start=${encodeURIComponent(start)}&end=${encodeURIComponent(end)}`);
      const data = await res.json();

      if (data.error) {
        statusLine.textContent = data.error;
        statusLine.classList.add('err');
        goBtn.disabled = false;
        return;
      }

      statusLine.textContent = '';
      tripMeta.style.display = 'flex';
      tripMeta.innerHTML = `
        <span>DISTANCE&nbsp; <b>${data.distance_km} km</b></span>
        <span>DURATION&nbsp; <b>${data.estimated_time_minutes} min</b></span>
      `;

      providerOrder.forEach((name, i) => {
        const isBest = name === data.recommended;
        const stub = document.createElement('div');
        stub.className = 'stub' + (isBest ? ' best' : '');
        stub.style.animationDelay = (0.05 + i * 0.1) + 's';
        stub.innerHTML = `
          ${isBest ? '<div class="stamp">BEST FARE</div>' : ''}
          <div class="provider">${name}</div>
          <div class="fare-currency">₹</div>
          <div class="fare-amount" data-target="${data.estimated_fares[name]}">₹0</div>
          <div class="eta">ETA ${data.Duration_Time[name]} min</div>
        `;
        stubsEl.appendChild(stub);
        const amountEl = stub.querySelector('.fare-amount');
        animateNumber(amountEl, Math.round(data.estimated_fares[name]), '₹');
      });

    } catch (e) {
      statusLine.textContent = 'Could not reach the fare service. Try again.';
      statusLine.classList.add('err');
    } finally {
      goBtn.disabled = false;
    }
  }

  goBtn.addEventListener('click', checkFares);
  [startInput, endInput].forEach(inp => {
    inp.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') checkFares();
    });
  });
</script>

</body>
</html>
